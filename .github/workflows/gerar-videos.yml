name: Gerador Automatico de Videos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: |
          npm install

      - name: Executar gerador
        run: |
          node gerar-serie.js

      - name: Guardar videos gerados
        uses: actions/upload-artifact@v3
        with:
          name: meus-videos-prontos
          path: '*.mp4'
name: Gerador Automatico de Videos

