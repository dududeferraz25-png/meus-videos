name: Gerador Automatico de Videos

on:
  workflow_dispatch: # Permite clicar num botão no site do GitHub para rodar quando quiser
  schedule:
    - cron: '0 0 * * *' # (Opcional) Pode rodar sozinho todos os dias, se quiser

jobs:
  build:
  runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar FFmpeg e ferramentas de audio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Instalar dependencias do projeto
        run: |
          npm install

      - name: Executar o gerador de videos
        run: |
          node gerar-serie.js

      - name: Guardar os videos gerados (Artifacts)
        uses: actions/upload-artifact@v3
        with:
          name: meus-videos-prontos
          path: '*.mp4'

